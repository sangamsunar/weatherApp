<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
</head>

<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-6">

  <h1 class="text-3xl font-bold mb-6">Weather App</h1>

  <button onclick="getWeather()" class="bg-blue-500 hover:bg-blue-600 px-6 py-2 rounded-xl shadow-lg mb-6 transition">
    Get Weather
  </button>

  <div id="weatherContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 w-full max-w-5xl"></div>

  <script>
    async function getWeather() {
      const container = document.getElementById("weatherContainer");
      container.innerHTML = "";

      try {
        const response = await fetch("http://localhost:5033/WeatherForecast");
        const data = await response.json();

        data.forEach(item => {
          const card = document.createElement("div");

          card.className = "bg-slate-800 p-5 rounded-2xl shadow-lg hover:scale-105 transition";

          card.innerHTML = `
            <h2 class="text-xl font-semibold mb-2">${item.summary}</h2>
            <p class="text-gray-400 mb-2">${item.date}</p>
            <p class="text-3xl font-bold">${item.temperatureC}°C</p>
          `;

          container.appendChild(card);
        });

      } catch (error) {
        console.error(error);
      }
    }
  </script>

</body>

</html>
